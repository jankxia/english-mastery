<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English-Mastery · 中小学英语学习技巧归档</title>
  <meta name="description" content="把全网各平台的小学/初中/高中英语学习技巧方法归档分类，配视频与互动练习，让孩子学英语不那么枯燥。" />
  <style>
    body {
      background: url("/bg.webp") no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
    }
    .main-wrap {
      background:rgba(255,255,255,0.88);
      min-height:100vh;
      display: flex;
      flex-direction: column;
    }
    .page-footer{
      margin-top: auto;
      padding:20px;
      border-top:1px solid #ccc;
      font-size:12px;
      color:#666;
    }
    /* 新增：默认隐藏主体区域，拿到用户信息后再显示，消除空白闪屏 */
    .content-wrap{
      flex:1;
    }
  </style>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="main-wrap">
  <div class="content-wrap">
    <!-- 顶栏与内容由 app.js 注入 -->
  </div>
  <!-- 页脚，flex自动压到底部 -->
  <div class="page-footer">
    <p>免责声明：本系统仅供个人学习交流使用，题库内容与解析仅作参考，不构成正式教学指导。</p>

    <p>联系邮箱： <a href="mailto:jankxia@163.com">jankxia@163.com</a></p>

</div>

<script>
    window.ROUTES = {
      logout: "/logout",
      admin: "/admin",
      changePwd: "/change_pwd"
    }
    // 先请求用户信息，拿到数据之后再动态加载全部JS
    fetch("/api/userinfo")
    .then(res=>res.json())
    .then(data=>{
        window.LOGIN_USER = data;
        // 按顺序动态加载js脚本，加载完成后启动页面渲染
        const scripts = [
          "js/data.js",
          "js/sentences.js",
          "js/words.js",
          "js/phonics.js",
          "js/textbook.js",
          "js/courses.js",
          "js/wordtricks.js",
          "js/curriculum.js",
          "js/app.js"
        ];
        function loadScript(index){
          if(index >= scripts.length) return;
          const s = document.createElement('script');
          s.src = scripts[index];
          s.onload = ()=> loadScript(index+1);
          document.querySelector('.content-wrap').appendChild(s);
        }
        loadScript(0);
    })
</script>
</body>
